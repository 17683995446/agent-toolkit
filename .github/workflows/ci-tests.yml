name: CI Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip wheel
          pip install pytest pytest-asyncio pytest-cov pytest-mock
          pip install httpx aiosqlite
          pip install -e ./shared

      - name: Create test database
        run: |
          mkdir -p test_reports

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test_agent_toolkit.db
          ENVIRONMENT: test
        run: |
          python -m pytest tests/ -v --cov=agent_toolkit --cov-report=xml --cov-report=html --cov-report=term || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            test_reports/
            coverage.xml
            htmlcov/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install redis asyncpg
          pip install -e ./shared

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_agent_toolkit
          REDIS__HOST: localhost
          ENVIRONMENT: test
        run: |
          python -m pytest tests/integration/ -v || true

  test-modules:
    name: Test Individual Modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared
          - registry
          - adapter
          - runtime
          - orchestrator
          - observability

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e ./shared

      - name: Test module imports
        run: |
          python -c "from agent_toolkit.${{ matrix.module }} import __version__; print('Module ${{ matrix.module }} version:', __version__)"

      - name: Run module tests
        run: |
          python -m pytest tests/${{ matrix.module }}/ -v --tb=short || true

  all-tests-pass:
    name: All Tests Passed
    needs: [test, integration-test, test-modules]
    runs-on: ubuntu-latest
    steps:
      - name: Check if all tests passed
        run: |
          echo "All test jobs completed"
