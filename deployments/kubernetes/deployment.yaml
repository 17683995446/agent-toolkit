# Agent Toolkit Kubernetes 部署配置
# 生产环境配置

apiVersion: v1
kind: Namespace
metadata:
  name: agent-toolkit
  labels:
    app: agent-toolkit
    environment: production

---
# ConfigMap - 应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-toolkit-config
  namespace: agent-toolkit
data:
  ENVIRONMENT: "production"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "agent_toolkit"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"

---
# Secret - 敏感配置
apiVersion: v1
kind: Secret
metadata:
  name: agent-toolkit-secrets
  namespace: agent-toolkit
type: Opaque
stringData:
  DATABASE_USER: "postgres"
  DATABASE_PASSWORD: "your-secure-password"
  REDIS_PASSWORD: "your-redis-password"
  SECRET_KEY: "your-secret-key-here"

---
# Deployment - 应用部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-toolkit
  namespace: agent-toolkit
  labels:
    app: agent-toolkit
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-toolkit
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agent-toolkit
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-toolkit-sa
      containers:
      - name: agent-toolkit
        image: agent-toolkit:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: agent-toolkit-config
        - secretRef:
            name: agent-toolkit-secrets
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/0"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
      volumes:
      - name: logs
        emptyDir: {}
      - name: data
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agent-toolkit
              topologyKey: kubernetes.io/hostname

---
# Service - 服务暴露
apiVersion: v1
kind: Service
metadata:
  name: agent-toolkit-service
  namespace: agent-toolkit
  labels:
    app: agent-toolkit
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: agent-toolkit

---
# Ingress - 入口配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-toolkit-ingress
  namespace: agent-toolkit
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  tls:
  - hosts:
    - agent-toolkit.yourdomain.com
    secretName: agent-toolkit-tls
  rules:
  - host: agent-toolkit.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agent-toolkit-service
            port:
              number: 8000

---
# HorizontalPodAutoscaler - 自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-toolkit-hpa
  namespace: agent-toolkit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-toolkit
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60

---
# ServiceAccount - 服务账户
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-toolkit-sa
  namespace: agent-toolkit

---
# PodDisruptionBudget - Pod 中断预算
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-toolkit-pdb
  namespace: agent-toolkit
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: agent-toolkit
