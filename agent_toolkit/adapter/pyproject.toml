[project]
name = "agent-toolkit-adapter"
version = "0.1.0"
description = "Tool Adapter Module for Agent Toolkit"
requires-python = ">=3.11"
dependencies = [
    "agent-toolkit-shared @ file:///${PROJECT_ROOT}/agent_toolkit/shared",
    "httpx>=0.26.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
