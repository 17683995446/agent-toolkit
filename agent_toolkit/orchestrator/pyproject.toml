[project]
name = "agent-toolkit-orchestrator"
version = "0.1.0"
description = "Tool Orchestrator Module for Agent Toolkit"
requires-python = ">=3.11"
dependencies = [
    "agent-toolkit-shared @ file:///${PROJECT_ROOT}/agent_toolkit/shared",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
