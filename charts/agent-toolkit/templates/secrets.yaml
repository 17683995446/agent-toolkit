apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-toolkit.fullname" . }}
  labels:
    {{- include "agent-toolkit.labels" . | nindent 4 }}
type: Opaque
stringData:
  database_url: {{ required "config.database.url is required" .Values.config.database.url | quote }}
  redis_password: {{ .Values.secrets.redis_password | default "" | quote }}
  secret_key: {{ required "secrets.secret_key is required" .Values.secrets.secret_key | quote }}
